name: refresh-funds

on:
  schedule:
    - cron: "30 3 * * *"   # every day 09:00 IST
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install playwright

      - run: playwright install --with-deps chromium

      - run: python scrape.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add funds.csv funds_raw.csv screenshot_regular.png
          git diff --staged --quiet || (git commit -m "Daily update" && git push)
